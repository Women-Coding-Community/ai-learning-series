name: AI review

# pull_request, never pull_request_target: a fork PR gets a read-only token and
# no secrets, so the worst a stranger's PR can do is fail its own gates.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Nothing by default. Each job asks for exactly what it needs.
permissions: {}

# A new push cancels the review of the old one: one paid run per PR at a time.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 1. Deterministic gates. Free, fast, and they can block the merge.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Secret scan
        run: python scripts/secret_scan.py

  # 2. The agent. It can read and think. It cannot write anywhere.
  review:
    needs: gates
    # Skip drafts, bots and forks. Forks would have no key anyway; skipping
    # them makes the decision visible instead of an error in the log.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The key lives in this environment, not in repo secrets. Add required
    # reviewers to the environment and a person approves every paid run.
    environment: ai-review
    permissions:
      contents: read
      id-token: write # only used by the optional Vertex AI route
    steps:
      # The reviewer and its rubric come from the base branch, so a PR cannot
      # rewrite the skill or the script that judges it.
      - name: Check out trusted reviewer (base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the PR as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # From the trusted checkout, so a PR cannot swap the reviewer's dependencies.
      - run: python -m pip install -r trusted/requirements-review.txt
      # Optional keyless route: set the repo variable WORKLOAD_IDENTITY_PROVIDER
      # (plus GOOGLE_CLOUD_PROJECT) and the model call goes to Vertex AI with a
      # short-lived token instead of an API key. Unset, this step is skipped.
      - name: Authenticate to Google Cloud (Vertex AI route)
        if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.VERTEX_SERVICE_ACCOUNT }}
      - name: Review the diff
        # PR text reaches the script through env, never through ${{ }} inside
        # run:, so a crafted title cannot become shell.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: ${{ vars.WORKLOAD_IDENTITY_PROVIDER != '' && 'true' || '' }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          WORKSPACE: ${{ github.workspace }}/pr
          SKILL_FILE: ${{ github.workspace }}/trusted/.agents/skills/pr-review/SKILL.md
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_MODEL_SMALL: ${{ vars.REVIEW_MODEL_SMALL }}
          MAX_DIFF_CHARS: '60000'
        run: python trusted/scripts/review.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings
          path: findings.json
          retention-days: 7

  # 3. The poster. It holds the only write token and never sees a model,
  #    the API key or the PR's code. Its whole input is findings.json.
  post:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # the checkout below needs it on a private repo
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: findings
      - run: python3 scripts/render_comment.py findings.json > comment.md
      - name: Post one comment, updated in place
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file comment.md
